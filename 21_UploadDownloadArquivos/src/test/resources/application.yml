server:
  port: 8888
cors:
  originPatterns: http://localhost:8080,http://localhost:3000,http://outra-origem-exemplo.com
file:
  upload-dir: /Users/romar/OneDrive/Imagens/Imagens
spring:
  output:
    ansi:
      enabled=always:
  application:
    name: rest-with-spring-boot-and-java-erudio
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  #    url: jdbc:mysql://localhost:3306/rest_with_spring_boot_erudio?useTimezone=true&serverTimezone=UTC
  #    username: root
  #    password: admin123    essas partee sera criada dinamicamente na classe de configuração do teste container
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215 MB
logging:
  level:
    root: INFO
    #br.com.fco_romario: DEBUG
spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true


